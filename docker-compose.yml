services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deverp}
      POSTGRES_USER: ${POSTGRES_USER:-deverp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deverp-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deverp} -d ${POSTGRES_DB:-deverp}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-deverp}:${POSTGRES_PASSWORD:-deverp-local-only}@db:5432/${POSTGRES_DB:-deverp}}"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-before-deploy-0123456789}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      BASE_CURRENCY: ${BASE_CURRENCY:-USD}
      TIME_ZONE: ${TIME_ZONE:-UTC}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-DevERP <noreply@localhost>}
      DEVERP_FRONTEND_URL: ${DEVERP_FRONTEND_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  postgres_data:
  media_data:
