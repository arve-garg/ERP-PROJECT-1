name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/development.txt
      - run: python -m pip install -r requirements/development.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy apps config
      - run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_SECRET_KEY: github-actions-validation-secret-key-not-for-production-123456789
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_SETTINGS_MODULE: config.settings.production
      - run: pytest --cov=apps --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
